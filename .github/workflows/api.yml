# API Spring Boot: compila, testes unitários, ArchUnit, Modulith e integração (Testcontainers).
name: API

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
              # O realm do Keycloak é testado pela API (KeycloakRealmIT).
              - 'infra/compose/keycloak/**'
              # O teste de contrato compara a API com o openapi.json do cliente.
              - 'packages/api-client/openapi.json'
              - '.github/workflows/api.yml'

  verify:
    name: mvnw verify
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/api/pom.xml
      # O runner já tem Docker: os testes *IT sobem PostgreSQL, Valkey e Kafka reais.
      - run: ./mvnw -B -ntp verify
      - name: Guardar relatórios de teste
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-de-teste
          path: |
            services/api/target/surefire-reports/
            services/api/target/failsafe-reports/
          retention-days: 7

  # Check único e sempre presente, usado como obrigatório na proteção da main.
  result:
    name: api-ok
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Conferir resultado
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
