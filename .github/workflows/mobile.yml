# App e pacotes TypeScript: Biome, typecheck e testes (Jest/Vitest) via Turborepo.
name: Mobile

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ts:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'biome.json'
              - '.nvmrc'
              - '.npmrc'
              - '.github/workflows/mobile.yml'

  check:
    name: Lint, typecheck e testes
    needs: changes
    if: needs.changes.outputs.ts == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Versão do pnpm vem do campo packageManager do package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test
      # O cliente gerado precisa bater com o contrato (packages/api-client/openapi.json).
      - name: Conferir cliente gerado pelo orval
        run: |
          pnpm --filter @bruzfin/api-client generate
          git diff --exit-code -- packages/api-client/src/generated \
            || { echo "::error::Cliente desatualizado: rode 'pnpm --filter @bruzfin/api-client generate' e commite."; exit 1; }

  # Check único e sempre presente, usado como obrigatório na proteção da main.
  # Passa quando o job rodou com sucesso ou foi pulado por não haver mudanças.
  result:
    name: mobile-ok
    needs: [changes, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Conferir resultado
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
