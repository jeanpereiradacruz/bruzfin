spring:
  application:
    name: bruzfin-api
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  modulith:
    events:
      # A tabela event_publication é criada pela migração Flyway, não automaticamente.
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

bruzfin:
  security:
    # Emissor dos tokens (realm bruzfin do Keycloak). Obrigatório: a API não sobe sem ele.
    issuer-uri: ${BRUZFIN_AUTH_ISSUER_URI:}
    audience: bruzfin-api
    public-api-docs: false
  rate-limit:
    authenticated-capacity: 120
    anonymous-capacity: 30
    period: 1m
